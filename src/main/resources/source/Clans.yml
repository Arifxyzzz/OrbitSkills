# Clan settings. Clans only give stats, no passive skills.
# Use /os set clan <player> <clan> to assign one.
# weight = higher number means easier to get.
# stats.damage-percent = all damage.
# stats.assassin-percent = melee damage.
# stats.archer-percent = bow/projectile damage.
# stats.health-percent = max HP.
# stats.defense-percent = damage reduction.
# stats.alchemy-percent = potion/heal power.
# stats.night-damage-percent = extra damage at night.
# Clan stats add together with race stats.
# Use /os disable clan to turn clan bonuses off.

clans:
  NONE:
    display-name: "&#8FA0B7N/A"
    stats: {}
