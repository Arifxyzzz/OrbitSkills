settings:
  # Language used by the plugin.
  # Available: EN, ID, MY, PH, CN, ES, JP, KR, TH, VN, RU, FR, DE.
  language: EN

  # Keeps old configs updated with new defaults.
  # Leave this value as-is.
  balance-version: 51

  # Maximum total SP a player can have.
  max-total-stat-points: 10000

  # Highest level players can reach.
  # Higher max-level spreads SP rewards across more levels.
  max-level: 100

  # 0.5 = SP per level rises gradually: about 50 early, 100 middle, 150 late.
  # 1.0 = every level gives the same amount.
  stat-point-curve-linear-weight: 0.5

  # How often player data is saved.
  save-interval-seconds: 180

  # Real HP stored by Minecraft.
  # The plugin can still show higher HP, like 4000, safely.
  # Keep 1024 for the safest setup.
  physical-health-cap: 1024

  # Locks the heart bar to a fixed number of hearts.
  # Keep true so high HP never draws a long row of hearts on screen.
  # Set false only if another plugin already controls the heart display.
  health-display-scaling: true

  # How many hearts the locked heart bar shows. 20 hearts = the vanilla row.
  health-display-hearts: 20.0

  # How often the heart bar lock is re-applied, in ticks. 20 ticks = 1 second.
  # Some forks, like UniverseSpigot, drop the lock after a hit and briefly show
  # extra hearts. This repeating refresh puts the bar back.
  # 0 = off. Raise this value if you want fewer refreshes.
  health-display-refresh-ticks: 40

  # How many ticks after an armor change the heart bar keeps being re-applied.
  # Equipment is not synced to the client on the tick it changes, and the packet
  # that carries it also carries the raw max health the heart bar is drawn from.
  # Refreshing on every tick of this window means a correction always follows it,
  # whichever tick it lands on. Raise this if equipping armor still flickers.
  health-display-equipment-ticks: 10

  # How long a one-off actionbar notice holds the slot, in milliseconds.
  # The HP/EXP bar below refreshes every second, which is fast enough to wipe a
  # notice before it can be read. During this window the repeating bar stays
  # quiet so Alchemy heals, race skills, and EXP gains stay visible.
  # 0 = off, notices get overwritten as before.
  actionbar-notice-ms: 2500

  # Shows short EXP progress when the repeating actionbar is off.
  actionbar-progress: true

# Repeating actionbar shown every second.
# false = hide the repeating actionbar.
actionbar: true

# Text shown in the actionbar. Colors support &#HEX.
# Health here shows the full RPG HP, not the smaller Minecraft HP limit.
actionbar-text: "&#FF3972❤ {health_formatted}&#6D7890/&#F7F3FF{max_health_formatted}      &#FFE7A3✦ {exp_formatted}&#6D7890/&#F7F3FF{needed_exp_formatted}"

modules:
  # Turn systems on or off for the whole server.
  # stats = stat point bonuses.
  # class = class rank bonuses.
  # race  = race passives and race stat bonuses.
  # clan  = clan stat bonuses.
  # Use /os disable <name> during PvP events.
  stats: true
  class: true
  race: true
  clan: true

# Missing keys are added automatically on update. Existing custom values stay unchanged.
# 10,000 total SP / 6 stats = about 1,667 points for 100% base stat power.
