auto-get:
  # Gives better rarity after too many unlucky rerolls.
  # Set any target to 0 to turn that guarantee off.
  Races:
    # false = race rerolls do not get guaranteed rarity.
    enabled: true
    targets:
      # After this many unlucky race rerolls, the player gets at least Epic.
      epic: 120
      # After this many unlucky race rerolls, the player gets Mythic.
      mythic: 500
  Stats_Class:
    # Class guarantee is counted separately from races and clans.
    enabled: true
    targets:
      epic: 80
      mythic: 300
  Clans:
    # Clan guarantee affects clan rerolls only.
    enabled: true
    targets:
      epic: 100
      mythic: 400

auto-reroll:
  # Auto reroll spends fragments until it gets the selected rarity.
  # This is a safety limit so one click cannot spend infinite fragments.
  max-fragments: 100
  # Time between each reroll step. 20 ticks = 1 second.
  delay-ticks: 8
  sounds:
    # Sound played for each rarity result.
    common: BLOCK_NOTE_BLOCK_HAT
    uncommon: BLOCK_NOTE_BLOCK_PLING
    rare: ENTITY_EXPERIENCE_ORB_PICKUP
    epic: ENTITY_PLAYER_LEVELUP
    mythic: UI_TOAST_CHALLENGE_COMPLETE

rarity-display:
  # Display names and colors used in menus/messages.
  # This changes only the text and color, not the roll chance.
  common:
    name: Common
    color: "&#D7DEE8"
  uncommon:
    name: Uncommon
    color: "&#B8F7D4"
  rare:
    name: Rare
    color: "&#A7E8FF"
  epic:
    name: Epic
    color: "&#C7B8FF"
  mythic:
    name: Mythic
    color: "&#FFD6A5"

rank-reroll:
  # Higher weight means easier to get. F is common, SSS is very rare.
  # Bigger weight = bigger chance.
  weights:
    F: 230000
    D: 135000
    C: 70000
    B: 30000
    A: 10000
    S: 2500
    SS: 600
    SSS: 80
  # Rarity name shown for each class rank.
  rarity:
    F: COMMON
    D: COMMON
    C: UNCOMMON
    B: RARE
    A: EPIC
    S: MYTHIC
    SS: MYTHIC
    SSS: MYTHIC
  colors:
    # Rank colors shown in menus and profile text.
    F: "&#9AA4B2"
    D: "&#B8C2CC"
    C: "&#B8F7D4"
    B: "&#A7E8FF"
    A: "&#C7B8FF"
    S: "&#FFD6A5"
    SS: "&#FFB6C8"
    SSS: "&#FF9FE8"
